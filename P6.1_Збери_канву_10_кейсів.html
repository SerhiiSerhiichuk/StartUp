function bar(l,v,m,c){return'<div class="bar"><div class="bl"><span>'+l+'</span><span>'+v+'/'+m+'</span></div><div class="bt"><i style="width:'+(m?Math.round(v/m*100):0)+'%;background:'+c+'"></i></div></div>'}
function list(items){return'<ul>'+items.map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ul>'}
function intro(){return'<div class="card"><p class="k">Практичне заняття · Бізнес-модель</p><h1 class="serif">Збери канву</h1><p class="mut">У грі 10 кейсів, щоразу випадає один (поки не пройдено всі). Спочатку ви бачите кейс і дев’ять наборів параметрів і обираєте, яку канву використати: Business Model Canvas чи Lean Canvas. Якщо вибір хибний, гра коротко пояснить чому. Якщо правильний, з’явиться канва: гра по черзі підсвічує блок, у порядку, прийнятому на практиці, а ви знаходите серед наборів той, що йому відповідає; за потреби можна самому клікнути будь-який порожній блок і заповнити його. Далі натисніть «Перевірити результат»: помилкові блоки стануть червоними, їх можна прибрати й розставити заново, а правильні залишаться на місці.</p><label class="sm" for="nm"><b>Ваше ім’я</b> <span class="mut">(необов’язково)</span></label><input id="nm" maxlength="40" placeholder="Наприклад, Олена К." value="'+esc(st.name)+'" style="margin:6px 0 16px"><button class="btn pri" data-a="start">Почати →</button><button class="link" data-a="teacher">Перегляд результатів групи (для викладача)</button></div>'}
function setsHtml(ro){var sc=st.scn;return st.order.map(function(id){var u=!ro&&usedSet(id),a=target();return ro?'<div class="set ro">'+list(sc.S[id])+'</div>':'<button class="set" data-a="card" data-id="'+id+'"'+(u||!a?" disabled":"")+'>'+list(sc.S[id])+'</button>'}).join("")}
function choose(){var sc=st.scn;
return'<div class="card"><p class="k">Кейс «'+esc(sc.title)+'» · етап 1: оберіть канву</p><div class="box" style="margin:0 0 4px">'+sc.ctx+'</div><h2>Параметри кейсу</h2><div class="cards">'+setsHtml(true)+'</div><h2>Яку канву використати для цього кейсу?</h2><div class="cvc">'+st.pickOrder.map(function(k){var w=st.wrongModel===k;return'<button class="btn" data-a="model" data-m="'+k+'"'+(w?" disabled":"")+'>'+CV[k].n+'</button>'}).join("")+'</div>'+(st.msg?'<div class="box" style="border-left:4px solid #B3492F"><b>Не зовсім.</b> '+st.msg+' Оберіть іншу канву.</div>':"")+'</div>'}
function cell(b){var cv=CVc(),i=cv.seq.indexOf(b),a=target(),id=st.place[b],cls="cell";
var mk=st.mark[b];if(id){cls+=mk==="ok"?" ok":(mk==="bad"?" bad":" fl")}else if(b===a)cls+=" act";
var click=!id||!st.locked[b];
return'<button class="'+cls+'" style="grid-area:'+b+';order:'+i+'" data-a="cell" data-b="'+b+'"'+(id?(click?' title="Натисніть, щоб прибрати"':' tabindex="-1"'):' title="Натисніть, щоб вибрати цей блок"')+'><div class="h"><span class="n">'+(i+1)+'</span><span>'+cv.B[b][0]+'</span></div>'+(id?list(st.scn.S[id]):"")+'</button>'}
function fill(){var sc=st.scn,cv=CVc(),a=target(),n=placedCount(),done=st.attempts>0&&allFilled()&&seq().every(function(b){return st.mark[b]==="ok"});
var step=done?'<div class="step"><b>✓ Усі блоки розставлено правильно</b></div>':(a?'<div class="step"><span style="background:#C9962C;color:#1E2761;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none">'+(cv.seq.indexOf(a)+1)+'</span><div><div class="sm" style="opacity:.75">Крок '+(cv.seq.indexOf(a)+1)+' із '+cv.seq.length+'</div><b>'+cv.B[a][0]+'</b><div class="sm">Оберіть набір параметрів для цього блока або клікніть інший порожній блок.</div></div></div>':'<div class="step"><b>Усі блоки заповнено. Натисніть «Перевірити результат».</b></div>');
var banner=st.msg?'<div class="box">'+st.msg+'</div>':"";
return'<div class="card"><div class="pg"><i style="width:'+Math.round(n/cv.seq.length*100)+'%"></i></div><p class="k">Кейс «'+esc(sc.title)+'» · '+cv.n+(st.attempts?' · перевірок: '+st.attempts:"")+'</p><div class="box" style="margin:0 0 12px"><b>✓ Канву обрано правильно.</b> '+sc.why+'</div>'+step+'<div class="cv '+cv.cls+'">'+cv.seq.map(cell).join("")+'</div>'+banner+'<div class="row" style="margin-top:12px">'+(done?'<button class="btn pri" data-a="result">Показати підсумок →</button>':'<button class="btn pri" data-a="check"'+(allFilled()&&st.dirty?"":" disabled")+'>Перевірити результат</button>')+'</div><h2>Набори параметрів</h2><div class="cards">'+setsHtml(false)+'</div></div>'}
function game(){return st.phase==="choose"?choose():fill()}
function verdict(n){if(n===9)return["Бездоганно з першої перевірки","Усі дев’ять блоків потрапили на свої місця одразу. Ви добре розрізняєте сусідні блоки, навіть коли в них трапляються однакові слова (наприклад, один і той самий клієнт у сегментах, каналах і відносинах)."];
if(n>=7)return["Майже без помилок","Більшість блоків розставлено правильно з першої перевірки. Помилки найчастіше виникають там, де одне слово може стояти в різних блоках: дивіться на його роль (кому продаємо, як доходимо, які відносини, що саме вимірюємо)."];
if(n>=4)return["Базова логіка є, але блоки плутаються","Частину блоків розпізнано, але сусідні блоки ще змішуються. Подивіться підказки до помилок і звіряйте кожен набір із питанням, на яке відповідає блок."];
return["Варто повторити блоки канви","Поки що набір і блок часто не збігаються. Пройдіться по підказках нижче й повторіть, на яке питання відповідає кожен блок, а потім спробуйте ще раз."]}
function result(){var sc=st.scn,cv=CVc(),n=9-st.first.length,v=verdict(n);
var rows=cv.seq.map(function(b,i){var bad=st.first.indexOf(b)>=0,pid=st.firstPlace[b];return'<tr><td>'+(i+1)+'</td><td>'+cv.B[b][0]+'</td><td>'+(bad?"✕":"✓")+'</td><td>'+(bad?'Ви розмістили набір блока «'+cv.B[pid][0]+'». <span class="mut">'+cv.B[b][1]+'</span>':"—")+'</td></tr>'}).join("");
return'<div class="card">'+(st.name?'<p class="k">'+esc(st.name)+'</p>':"")+'<h1 class="serif">Ваш результат</h1><p class="mut sm">Кейс «'+esc(sc.title)+'» · '+cv.n+'</p>'+bar("Правильно з першої перевірки",n,9,"#C9962C")+'<p class="mut sm">Перевірок до повного результату: '+st.attempts+'. Канву обрано '+(st.modelMiss?"з другої спроби":"з першої спроби")+'.</p><div class="hero"><div class="lb">ПІДСУМОК</div><div class="nm">'+v[0]+'</div><p>'+v[1]+'</p><p><b>Вибір канви.</b> '+sc.why+'</p></div><h2>Блоки за порядком заповнення</h2><div style="overflow-x:auto"><table><tr><th>№</th><th>Блок</th><th>1-ша перевірка</th><th>Що пішло не так</th></tr>'+rows+'</table></div>'+(st.manual?'<div class="box"><p class="sm">Автокопіювання недоступне. Виділіть текст і скопіюйте вручну:</p><textarea id="man" rows="9" readonly>'+esc(st.manual)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="copy">Скопіювати результат</button><button class="btn" data-a="retry">Наступний кейс</button></div><button class="link" data-a="teacher">Перегляд результатів групи (для викладача)</button></div>'}
function report(){var sc=st.scn,cv=CVc(),n=9-st.first.length,L=["«Збери канву» (кейс «"+sc.title+"»)","Студент: "+(st.name||"—"),"Канва: "+cv.n+" (обрано "+(st.modelMiss?"з другої спроби":"з першої спроби")+")","Правильно з першої перевірки: "+n+" з 9","Перевірок до повного результату: "+st.attempts];
if(st.first.length){L.push("Помилки першої перевірки:");st.first.forEach(function(b){L.push(cv.B[b][0]+": розміщено набір блока «"+cv.B[st.firstPlace[b]][0]+"»")})}else L.push("Помилок не було.");return L.join("\n")}
function record(){return{name:st.name,ts:Date.now(),date:new Date().toLocaleString("uk-UA"),sid:st.scn.id,title:st.scn.title,cv:st.scn.cv,mok:st.modelMiss?0:1,n:9-st.first.length,att:st.attempts,wrong:st.first.slice()}}
function csvEsc(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'}
function toCsv(rows){var h=["Ім’я","Дата","Кейс","Канва кейсу","Канву обрано з першої спроби","Правильно з першої перевірки (з 9)","Перевірок","Помилкові блоки першої перевірки"];var L=[h.map(csvEsc).join(";")];
rows.forEach(function(r){var c=CV[r.cv];L.push([r.name||"",r.date||"",r.title||"",c?c.n:r.cv,r.mok?"так":"ні",r.n,r.att,(r.wrong||[]).map(function(b){return c&&c.B[b]?c.B[b][0]:b}).join(", ")].map(csvEsc).join(";"))});return"\uFEFF"+L.join("\r\n")}
function save(){if(st.saved)return;st.saved=true;try{if(window.storage&&window.storage.set){window.storage.set("responses:"+Date.now()+"-"+Math.floor(Math.random()*1e6),JSON.stringify(record()),true).catch(function(){})}}catch(e){}}
function loadAll(cb){try{if(!window.storage||!window.storage.list){cb(null);return}
window.storage.list("responses:",true).then(function(r){var keys=(r&&r.keys)||[];return Promise.all(keys.map(function(k){return window.storage.get(k,true).then(function(x){return x?JSON.parse(x.value):null}).catch(function(){return null})}))}).then(function(arr){cb(arr.filter(Boolean).sort(function(a,b){return b.ts-a.ts}))}).catch(function(){cb(null)})}catch(e){cb(null)}}
function teacherHtml(){var t=st.teacher,b;
if(t==="load")b='<p class="mut">Завантаження…</p>';
else if(t===null||t===undefined)b='<p class="mut">Збереження результатів недоступне в цьому режимі (наприклад, файл відкрито без чату). Користуйтеся кнопкою «Скопіювати результат» на екрані підсумку.</p>';
else if(!t.length)b='<p class="mut">Результатів поки немає.</p>';
else{var mo=t.filter(function(r){return r.mok}).length;b='<p class="sm"><b>Проходжень:</b> '+t.length+' · канву з першої спроби обрали правильно: '+mo+' із '+t.length+'</p><h2>Кейси</h2><div style="overflow-x:auto"><table><tr><th>Кейс</th><th>Канва</th><th>Проходжень</th><th>Канва з 1-ї спроби</th><th>Середній результат</th></tr>'+SC.map(function(s){var R=t.filter(function(r){return r.sid===s.id});if(!R.length)return"";return'<tr><td>'+esc(s.title)+'</td><td>'+CV[s.cv].n+'</td><td>'+R.length+'</td><td>'+R.filter(function(r){return r.mok}).length+'/'+R.length+'</td><td>'+(R.reduce(function(a,r){return a+r.n},0)/R.length).toFixed(1)+' з 9</td></tr>'}).join("")+'</table></div>';
["bmc","lean"].forEach(function(k){var R=t.filter(function(r){return r.cv===k});if(!R.length)return;var c=CV[k];b+='<h2>'+c.n+': блоки, де помилялися</h2>'+c.seq.map(function(id){var w=R.filter(function(r){return(r.wrong||[]).indexOf(id)>=0}).length;return bar(c.B[id][0],w,R.length,"#B3492F")}).join("")});
b+='<div style="overflow-x:auto;margin-top:12px"><table><tr><th>Ім’я</th><th>Дата</th><th>Кейс</th><th>З 1-ї перевірки</th><th>Перевірок</th></tr>'+t.map(function(r){return'<tr><td>'+esc(r.name||"—")+'</td><td>'+esc(r.date||"")+'</td><td>'+esc(r.title||"")+'</td><td>'+r.n+'/9</td><td>'+r.att+'</td></tr>'}).join("")+'</table></div>'}
return'<div class="ov"><div class="card"><h1 class="serif" style="font-size:22px">Результати групи</h1>'+b+(st.csvText?'<div class="box"><p class="sm">Завантаження недоступне. Скопіюйте CSV:</p><textarea rows="6" readonly>'+esc(st.csvText)+'</textarea></div>':"")+'<div class="row"><button class="btn" data-a="tcsv"'+(st.teacher&&st.teacher!=="load"&&st.teacher.length?"":" disabled")+'>Експорт CSV</button><button class="btn" data-a="trefresh">Оновити</button><button class="btn" data-a="tclose">Закрити</button></div></div></div>'}
function render(){var m={intro:intro,game:game,result:result};app.innerHTML='<div class="st'+(st.screen==="game"&&st.phase==="fill"?"":" n")+'">'+m[st.screen]()+'</div>'+(st.teacherOpen?teacherHtml():"")}
function openTeacher(){st.teacherOpen=true;st.teacher="load";st.csvText="";render();loadAll(function(r){st.teacher=r;render()})}
function pickScenario(){var un=SC.filter(function(s){return st.seen.indexOf(s.id)<0});if(!un.length){st.seen=[];un=SC}var s=un[Math.floor(Math.random()*un.length)];st.seen.push(s.id);return s}
function pickCard(id){var a=target();if(st.phase!=="fill"||!a||usedSet(id))return;st.place[a]=id;st.sel=null;delete st.mark[a];st.dirty=true;if(!seq().some(function(b){return st.mark[b]==="bad"}))st.msg="";render()}
function clickCell(b){if(st.phase!=="fill"||st.locked[b])return;if(st.place[b]){delete st.place[b];delete st.mark[b];st.dirty=true;st.sel=b}else st.sel=b;render()}
function chooseModel(m){if(st.phase!=="choose"||m===st.wrongModel)return;if(m===st.scn.cv){st.phase="fill";st.msg="";render();window.scrollTo(0,0)}else{st.modelMiss++;st.wrongModel=m;st.msg=st.scn.miss;render()}}
function check(){if(st.phase!=="fill"||!allFilled()||!st.dirty)return;st.attempts++;st.dirty=false;var bad=[];seq().forEach(function(b){if(st.place[b]===b){st.locked[b]=true;st.mark[b]="ok"}else{st.mark[b]="bad";bad.push(b)}});
if(st.first===null){st.first=bad.slice();st.firstPlace=JSON.parse(JSON.stringify(st.place))}
if(bad.length){st.msg="Правильно: <b>"+(9-bad.length)+" із 9</b>. Помилкові блоки підсвічено червоним. Натисніть на червоний блок, щоб прибрати набір, і розставте заново; правильні блоки залишаються на місці."}else{st.msg="";save()}render()}
function copyReport(){var t=report();function fb(){st.manual=t;render();var x=document.getElementById("man");if(x&&x.select)x.select()}
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.manual="";var b=app.querySelector('[data-a="copy"]');if(b)b.textContent="Скопійовано ✓"},fb)}else fb()}catch(e){fb()}}
function downloadCsv(){var csv=toCsv(st.teacher);try{var bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download="Канва_результати.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){st.csvText=csv;render()}}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
if(a==="start"){var n=document.getElementById("nm");if(n)st.name=n.value.trim();st.scn=pickScenario();st.sel=null;st.phase="choose";st.pickOrder=shuffle(["bmc","lean"]);st.wrongModel=null;st.modelMiss=0;st.order=cardOrder(st.scn.cv);st.place={};st.locked={};st.mark={};st.dirty=false;st.attempts=0;st.first=null;st.firstPlace=null;st.msg="";st.manual="";st.saved=false;st.screen="game";render()}
else if(a==="model")chooseModel(b.dataset.m);
else if(a==="card")pickCard(b.dataset.id);
else if(a==="cell")clickCell(b.dataset.b);
else if(a==="check")check();
else if(a==="result"){st.screen="result";st.manual="";render();window.scrollTo(0,0)}
else if(a==="retry"){st.screen="intro";st.manual="";render()}
else if(a==="copy")copyReport();
else if(a==="teacher"||a==="trefresh")openTeacher();
else if(a==="tcsv")downloadCsv();
else if(a==="tclose"){st.teacherOpen=false;st.csvText="";render()}});
window.__cv={CV:CV,SC:SC,st:st,cardOrder:cardOrder,toCsv:toCsv,verdict:verdict};
render();
})();
</script></body></html>
