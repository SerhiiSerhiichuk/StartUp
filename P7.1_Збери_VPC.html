function intro(){return'<div class="card"><p class="k">Практичне заняття · Бізнес-модель · Value Proposition Canvas</p><h1 class="serif">Збери Value Proposition Canvas</h1><p class="mut">Кейси ті самі, що й у грі з канвами. Вам дають сегмент клієнтів і 18 коротких стікерів: їх треба розкласти по шести елементах: «Профіль клієнта» (завдання, болі, вигоди) і «Карта цінності» (продукти, знеболювачі, створювачі вигод). У кожному елементі по три стікери.</p><div class="box"><b>Як відрізнити стікери.</b> Завдання — це дії клієнта. Болі й вигоди — що відчуває й чого хоче клієнт. Продукти — назви того, що ви пропонуєте. Знеболювачі й створювачі вигод — що робите ви («Привозимо…», «Додаємо…»): перші усувають конкретний біль, другі дають бажану вигоду.</div><div class="hint"><span>🎨</span><span><b>Кольори.</b> Усі стікери спершу сірі. Після перевірки правильно розміщені стікери змінюють колір: зелений — завдання клієнта й продукти, рожевий — болі й знеболювачі, блакитний — вигоди й створювачі вигод. Хибні лишаються сірими з червоною рамкою.</span></div><div class="hint"><span>🖱️</span><span><b>Два способи розкладати.</b> Перетягніть стікер у зону мишкою. Або натисніть зону (вона підсвітиться) і натискайте стікери, що їй підходять. Можна й навпаки: натисніть стікер, потім зону.</span></div><div class="row" style="margin-top:6px"><button class="btn" data-a="demo">'+(st.demo?"Сховати приклад: Tesla":"Показати приклад: Tesla")+'</button></div>'+(st.demo?'<h2>Приклад: Tesla</h2><p class="sm mut">Сегмент: '+TESLA.seg+'. Зверніть увагу: кожен знеболювач відповідає конкретному болю, створювач вигод — вигоді, а продукт — завданню клієнта.</p>'+roVpc(TESLA)+fitTable(TESLA):"")+'<label class="sm" for="nm"><b>Ваше ім’я</b> <span class="mut">(необов’язково)</span></label><input id="nm" maxlength="40" placeholder="Наприклад, Олена К." value="'+esc(st.name)+'" style="margin:6px 0 16px"><button class="btn pri" data-a="start">Почати →</button><button class="link" data-a="teacher">Перегляд результатів групи (для викладача)</button></div>'}

function verdict(n,N,sameZone){if(sameZone)return["Усі стікери в одній зоні","Ви розмістили всі стікери в зоні «"+sameZone+"», тож результат мало говорить про розуміння канви. Спробуйте щоразу питати: це дія клієнта, його відчуття, назва пропозиції чи те, що робимо ми?"];
